<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=22">
  <link rel="stylesheet" href="css/responsive.css?v=22">
  <style>
    .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); position: relative; overflow: hidden; }
    .error-page::before { content: ''; position: absolute; inset: 0; background: url('images/1581092160562-40aa08e78837.webp') center/cover no-repeat; opacity: 0.05; }
    .error-particles { position: absolute; inset: 0; overflow: hidden; }
    .error-particle { position: absolute; width: 6px; height: 6px; background: rgba(245, 158, 11, 0.3); border-radius: 50%; animation: floatSlow 6s ease-in-out infinite; }
    .error-particle:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
    .error-particle:nth-child(2) { top: 70%; left: 85%; animation-delay: 1s; width: 10px; height: 10px; }
    .error-particle:nth-child(3) { top: 40%; left: 50%; animation-delay: 2s; }
    .error-particle:nth-child(4) { top: 80%; left: 20%; animation-delay: 3s; width: 8px; height: 8px; }
    .error-particle:nth-child(5) { top: 25%; left: 75%; animation-delay: 0.5s; }
    .error-content { text-align: center; position: relative; z-index: 1; padding: 40px; }
    .error-code { font-size: 12rem; font-weight: 900; background: linear-gradient(135deg, #f59e0b, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; animation: bounceIn 1s ease; }
    .error-glitch { position: relative; display: inline-block; }
    .error-glitch::before, .error-glitch::after { content: '404'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .error-glitch::before { color: #f97316; animation: glitch 3s infinite; clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); }
    .error-glitch::after { color: #f59e0b; animation: glitch 2s infinite reverse; clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%); }
    @keyframes glitch { 0% { transform: translate(0); } 20% { transform: translate(-3px, 3px); } 40% { transform: translate(3px, -3px); } 60% { transform: translate(-2px, -2px); } 80% { transform: translate(2px, 2px); } 100% { transform: translate(0); } }
    .error-title { font-size: 2rem; color: #fff; margin: 20px 0 15px; }
    .error-text { color: rgba(255,255,255,0.6); font-size: 1.1rem; max-width: 500px; margin: 0 auto 35px; line-height: 1.8; }
    .error-actions { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .error-search { margin-top: 40px; display: flex; max-width: 400px; margin-left: auto; margin-right: auto; }
    .error-search input { flex: 1; padding: 16px 24px; border: 2px solid rgba(255,255,255,0.1); border-radius: 50px 0 0 50px; background: rgba(255,255,255,0.05); color: #fff; font-size: 1rem; outline: none; transition: border-color 0.3s; }
    .error-search input::placeholder { color: rgba(255,255,255,0.4); }
    .error-search input:focus { border-color: #f59e0b; }
    .error-search button { padding: 16px 28px; background: linear-gradient(135deg, #f59e0b, #f97316); border: none; border-radius: 0 50px 50px 0; color: #fff; cursor: pointer; font-size: 1.1rem; transition: all 0.3s; }
    .error-search button:hover { background: linear-gradient(135deg, #f97316, #f59e0b); }
    .error-illustration { font-size: 5rem; margin-bottom: 20px; color: rgba(245, 158, 11, 0.2); animation: float 4s ease-in-out infinite; }
    .error-pulse { display: inline-block; width: 20px; height: 20px; background: #f59e0b; border-radius: 50%; animation: ripple 2s infinite; margin-right: 8px; vertical-align: middle; }
    .error-logo { position: absolute; top: 24px; left: 24px; z-index: 2; }
    .error-logo img { height: 50px; width: auto; border-radius: 8px; }
    @media (max-width: 768px) {
      .error-code { font-size: 7rem; }
      .error-title { font-size: 1.5rem; }
      .error-actions { flex-direction: column; align-items: center; }
      .error-search { flex-direction: column; border-radius: 50px; }
      .error-search input { border-radius: 50px; margin-bottom: 10px; }
      .error-search button { border-radius: 50px; }
      .error-logo { top: 16px; left: 16px; }
      .error-logo img { height: 44px; }
    }
  </style>
</head>
<body>
<div class="error-page">
  <a href="index.html" class="error-logo"><img loading="lazy" decoding="async" src="images/logo.webp" alt="Stackly"></a>
  <div class="error-particles">
    <div class="error-particle"></div><div class="error-particle"></div>
    <div class="error-particle"></div><div class="error-particle"></div>
    <div class="error-particle"></div>
  </div>
  <div class="error-content animate-on-scroll scale-in">
    <div class="error-illustration"><i class="fas fa-plug"></i></div>
    <div class="error-code"><span class="error-glitch">404</span></div>
    <h1 class="error-title"><span class="error-pulse"></span> Connection Lost</h1>
    <p class="error-text">Looks like the page you're searching for has been disconnected. It may have moved, been removed, or never existed. Let's get you back on track.</p>
    <div class="error-actions">
      <a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Back to Home</a>
      <button type="button" class="btn-secondary" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = 'index.html'; }"><i class="fas fa-arrow-left"></i> Go Back</button>
    </div>
  </div>
</div>
<script src="js/script.js?v=22"></script>
</body>
</html>
